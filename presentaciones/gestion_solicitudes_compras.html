<script>
/* ===== MÓDULO gsc/motor.js · Motor de tiempo determinista, paleta, utilidades y reproductor ===== */
// Cada lámina es una función pura de t: construir(L) crea los elementos y
// registra actualizaciones con L.al(fn); el motor pinta el cuadro de t.
(function () {
  const G = window.GSC = window.GSC || {};
  G.laminas = G.laminas || [];
  const C = G.C = {
    azul: '#0062A0', prof: '#004273', medio: '#1F84EC', cel: '#3ABFF0',
    suave: '#D5E7F2', suave2: '#EDF4F9', coral: '#C96442', coral2: '#E88663',
    arena: '#8E7A69', arena2: '#BCA493', crema: '#FFF6E0', tinta: '#282828',
    gris: '#4A4A4A', gris2: '#747474', lin: '#D4D4D4', lin2: '#E7E7E7', fondo: '#F4F4F4',
    verde: '#2E7D4F', verde2: '#E3F1E8', amarillo: '#FFF2B3'
  };
  const F = G.F = {
    h: "font-family:gobCL,sans-serif;font-weight:800;",
    r: "font-family:gobCL,sans-serif;font-weight:400;",
    m3: "font-family:'Museo Sans',sans-serif;font-weight:300;",
    m5: "font-family:'Museo Sans',sans-serif;font-weight:500;",
    mono: "font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:400;"
  };
  const clamp = G.clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
  const mix = G.mix = (a, b, k) => a + (b - a) * k;
  // Tres curvas y ninguna más
  const E = G.E = {
    entrar: x => 1 - Math.pow(1 - clamp(x), 3),
    mover: x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
    destacar: x => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  };
  const tr = G.tr = (t, a, d) => clamp((t - a) / (d || 1e-6));
  G.rng = function (s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  G.mezcla = (a, b, k) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(mix(v, B[i], clamp(k)))).join(',') + ')'; };
  G.tx = (s, f, c) => F[f || 'r'] + 'font-size:' + s + 'px;color:' + (c || C.gris) + ';';
  G.miles = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const el = G.el = (tag, css, html, padre) => { const e = document.createElement(tag); if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; if (padre) padre.appendChild(e); return e; };
  const NS = 'http://www.w3.org/2000/svg';
  const svg = G.svg = (tag, at, padre) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (padre) padre.appendChild(e); return e; };

  function crearL(def, raiz) {
    const ups = [];
    const L = { raiz, def };
    L.el = (tag, css, html, p) => el(tag, css, html, p || raiz);
    L.abs = (x, y, w, h, css, html, p) => el('div', 'position:absolute;box-sizing:border-box;left:' + x + 'px;top:' + y + 'px;' + (w != null ? 'width:' + w + 'px;' : '') + (h != null ? 'height:' + h + 'px;' : '') + (css || ''), html, p || raiz);
    L.lienzo = (p, css) => svg('svg', { viewBox: '0 0 1920 1080', width: 1920, height: 1080, style: 'position:absolute;left:0;top:0;overflow:visible;pointer-events:none;' + (css || '') }, p || raiz);
    L.al = fn => (ups.push(fn), fn);
    L.actualizar = t => { for (let i = 0; i < ups.length; i++) ups[i](t); };
    // Entrada estándar: opacidad y desplazamiento con la curva «entrar»
    L.aparece = (e, t0, o) => {
      o = o || {}; const d = o.d || 0.7, dy = o.dy == null ? 20 : o.dy, dx = o.dx || 0;
      ups.push(t => {
        let k = E.entrar(tr(t, t0, d)); if (o.hasta != null) k *= 1 - E.entrar(tr(t, o.hasta, 0.5));
        e.style.opacity = k * (o.op == null ? 1 : o.op); e.style.visibility = k < 0.002 ? 'hidden' : 'visible';
        e.style.transform = 'translate(' + (dx * (1 - k)).toFixed(2) + 'px,' + (dy * (1 - k)).toFixed(2) + 'px)' + (o.s ? ' scale(' + mix(o.s, 1, E.destacar(tr(t, t0, d))).toFixed(4) + ')' : '');
      });
      return e;
    };
    L.traza = (p, t0, d) => {
      p.setAttribute('pathLength', '1'); p.style.strokeDasharray = '1 1';
      ups.push(t => { const k = E.mover(tr(t, t0, d)); p.style.strokeDashoffset = (1 - k).toFixed(4); p.style.visibility = k < 0.001 ? 'hidden' : 'visible'; });
      return p;
    };
    L.titulo = (txt, sub, t0) => {
      t0 = t0 == null ? 0.15 : t0;
      L.aparece(L.abs(96, 60, 1728, null, 'line-height:1.1;' + G.tx(52, 'h', C.tinta), txt), t0);
      if (sub) L.aparece(L.abs(96, 136, 1500, null, 'line-height:1.35;' + G.tx(24, 'r')), t0 + 0.25).innerHTML = sub;
    };
    L.tarjeta = (x, y, w, h, css, html, p) => L.abs(x, y, w, h, 'background:#fff;border:1px solid ' + C.lin2 + ';border-radius:16px;' + (css || ''), html, p);
    L.chip = (txt, css) => '<span style="display:inline-block;padding:4px 14px;border-radius:999px;background:' + C.suave2 + ';' + G.tx(19, 'r', C.prof) + (css || '') + '">' + txt + '</span>';
    L.num = n => '<span style="display:inline-grid;place-items:center;width:60px;height:60px;border-radius:50%;background:' + C.azul + ';' + G.tx(30, 'h', '#fff') + '">' + n + '</span>';
    L.ilu = (x, y, txt, p) => L.abs(x, y, null, null, 'pointer-events:none;padding:5px 16px 4px;border-radius:999px;background:' + C.crema + ';border:1px solid ' + C.arena2 + ';white-space:nowrap;' + G.tx(20, 'm5', C.gris), txt || 'Datos ilustrativos', p);
    L.banda = (y, txt, t0, h) => L.aparece(L.abs(96, y, 1728, h || 120, 'display:flex;align-items:center;padding:0 40px;border-radius:16px;background:' + C.azul + ';line-height:1.35;' + G.tx(30, 'h', '#fff'), txt), t0);
    return L;
  }
